<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>90-Day JavaScript Roadmap | Raghav Sihag</title>
<meta name="description" content="Interactive 90-day JavaScript learning roadmap with 12 weeks of structured topics and progress tracking.">
<link rel="canonical" href="https://raghavsihag.me/js.html">
<meta property="og:title" content="90-Day JavaScript Roadmap | Raghav Sihag">
<meta property="og:description" content="Interactive 90-day JavaScript learning roadmap with 12 weeks of structured topics and progress tracking.">
<meta property="og:url" content="https://raghavsihag.me/js.html">
<meta property="og:type" content="article">
<meta name="author" content="Raghav Sihag">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --bg: #0f0f13;
  --surface: #1a1a22;
  --surface-2: #22222e;
  --surface-3: #2a2a38;
  --border: rgba(255,255,255,0.06);
  --border-hover: rgba(255,255,255,0.12);
  --text: #f0f0f5;
  --text-dim: #8888a0;
  --text-muted: #5c5c72;

  --accent-1: #ff6b9d;
  --accent-1-bg: rgba(255,107,157,0.08);
  --accent-1-glow: rgba(255,107,157,0.25);

  --accent-2: #6ba3ff;
  --accent-2-bg: rgba(107,163,255,0.08);
  --accent-2-glow: rgba(107,163,255,0.25);

  --accent-3: #6bffb8;
  --accent-3-bg: rgba(107,255,184,0.08);
  --accent-3-glow: rgba(107,255,184,0.25);

  --gradient-main: linear-gradient(135deg, #ff6b9d, #c084fc, #6ba3ff);
  --gradient-timer: linear-gradient(135deg, #6ba3ff, #c084fc);
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 2rem 1.25rem 4rem;
}

/* ─── HERO SECTION ─── */
.hero {
  text-align: center;
  padding: 3rem 1.5rem 2rem;
  position: relative;
}

.hero::before {
  content: '';
  position: absolute;
  top: -60px;
  left: 50%;
  transform: translateX(-50%);
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(192,132,252,0.12) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 100px;
  padding: 6px 16px;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-dim);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 1.25rem;
  position: relative;
  z-index: 1;
}

.hero-badge .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent-3);
  animation: pulse-dot 2s ease infinite;
}

@keyframes pulse-dot {
  0%, 100% { opacity: 1; box-shadow: 0 0 0 0 var(--accent-3-glow); }
  50% { opacity: 0.7; box-shadow: 0 0 0 6px transparent; }
}

.hero h1 {
  font-size: clamp(2rem, 5vw, 2.75rem);
  font-weight: 900;
  background: var(--gradient-main);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.15;
  margin-bottom: 0.5rem;
  position: relative;
  z-index: 1;
  letter-spacing: -0.5px;
}

.hero h1 span {
  display: block;
  font-size: clamp(1rem, 2.5vw, 1.15rem);
  font-weight: 600;
  background: none;
  -webkit-text-fill-color: var(--text-dim);
  margin-top: 0.5rem;
  letter-spacing: 0;
}

/* ─── STATS ROW ─── */
.stats-row {
  display: flex;
  justify-content: center;
  gap: 2rem;
  margin: 1.75rem 0 0.5rem;
  position: relative;
  z-index: 1;
}

.stat-item {
  text-align: center;
}

.stat-value {
  font-size: 1.75rem;
  font-weight: 900;
  color: var(--text);
  line-height: 1;
}

.stat-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-top: 4px;
}

/* ─── PROGRESS BAR ─── */
.progress-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1.25rem 1.5rem;
  margin-bottom: 1.5rem;
}

.progress-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.progress-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.progress-pct {
  font-size: 22px;
  font-weight: 900;
  background: var(--gradient-main);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.progress-track {
  height: 10px;
  background: var(--surface-3);
  border-radius: 10px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--gradient-main);
  border-radius: 10px;
  transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
}

.progress-fill::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  animation: shimmer 2s infinite;
}

@keyframes shimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

/* ─── COUNTDOWN TIMER ─── */
.timer-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1.5rem;
  margin-bottom: 2rem;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.timer-section::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--gradient-timer);
}

.timer-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 1rem;
}

.timer-digits {
  display: flex;
  justify-content: center;
  gap: 8px;
  align-items: center;
}

.timer-unit {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.timer-card {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 16px;
  min-width: 64px;
}

.timer-card .num {
  font-size: 1.75rem;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  background: var(--gradient-timer);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
}

.timer-unit .unit-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.timer-sep {
  font-size: 1.5rem;
  font-weight: 900;
  color: var(--text-muted);
  margin-bottom: 18px;
  animation: blink 1s step-end infinite;
}

@keyframes blink {
  50% { opacity: 0.3; }
}

/* ─── PHASE SECTIONS ─── */
.phase {
  margin-bottom: 2rem;
  border-radius: 20px;
  border: 1px solid var(--border);
  overflow: hidden;
  background: var(--surface);
}

.phase-header {
  padding: 1.25rem 1.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.phase-info h2 {
  font-size: 1.1rem;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 2px;
}

.phase-meta {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-dim);
}

.phase-badge {
  text-align: right;
  background: var(--surface-2);
  padding: 8px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
}

.phase-badge .pct {
  font-size: 16px;
  font-weight: 900;
  line-height: 1;
}

.phase-badge .frac {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  margin-top: 2px;
}

.phase-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 10px;
  padding: 0 1rem 1rem;
}

/* ─── WEEK CARDS ─── */
.wk {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 14px;
  transition: all 0.25s ease;
  overflow: hidden;
}

.wk:hover {
  border-color: var(--border-hover);
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
}

.wk.expanded {
  border-color: var(--border-hover);
}

.wh {
  padding: 14px 16px;
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.wh-content { flex: 1; min-width: 0; }

.week-tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 8px;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.week-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
  margin-bottom: 3px;
}

.week-days {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
}

.week-progress {
  margin-top: 10px;
  height: 4px;
  background: var(--surface-3);
  border-radius: 4px;
  overflow: hidden;
}

.week-progress-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.4s ease;
}

.week-count {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 600;
  margin-top: 4px;
}

.wh-arrow {
  font-size: 12px;
  color: var(--text-muted);
  flex-shrink: 0;
  margin-top: 4px;
  transition: transform 0.3s ease;
}

.wh-arrow.open { transform: rotate(180deg); }

/* ─── TOPIC LIST ─── */
.wb {
  padding: 6px 16px 14px;
  border-top: 1px solid var(--border);
}

.topic-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 8px 4px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s ease;
}

.topic-row:hover {
  background: rgba(255,255,255,0.02);
}

.cute-checkbox {
  appearance: none;
  -webkit-appearance: none;
  background: transparent;
  margin: 0;
  width: 18px;
  height: 18px;
  border: 2px solid var(--text-muted);
  border-radius: 6px;
  display: grid;
  place-content: center;
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  cursor: pointer;
  flex-shrink: 0;
  margin-top: 1px;
}

.cute-checkbox::before {
  content: "";
  width: 9px;
  height: 9px;
  transform: scale(0);
  transition: 120ms transform cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: inset 1em 1em white;
  transform-origin: center;
  clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
}

.cute-checkbox:checked {
  border-color: var(--chk-color);
  background: var(--chk-color);
}

.cute-checkbox:checked::before { transform: scale(1); }

.topic-text {
  font-size: 13px;
  font-weight: 600;
  line-height: 1.4;
  color: var(--text);
  transition: all 0.2s;
}

.topic-text.done {
  text-decoration: line-through;
  color: var(--text-muted);
  opacity: 0.5;
}

/* ─── RESPONSIVE ─── */
@media (max-width: 600px) {
  .container { padding: 1rem 0.75rem 3rem; }
  .hero { padding: 2rem 1rem 1.5rem; }
  .stats-row { gap: 1.25rem; }
  .timer-card { min-width: 52px; padding: 10px 12px; }
  .timer-card .num { font-size: 1.4rem; }
  .phase-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="container">
  <!-- Hero -->
  <div class="hero">
    <div class="hero-badge"><span class="dot"></span> 90 Days</div>
    <h1>
      JavaScript Roadmap
      <span>12 weeks · 3 phases · hands-on projects</span>
    </h1>
    <div class="stats-row" id="hero-stats"></div>
  </div>

  <!-- Progress -->
  <div class="progress-section" id="progress-bar"></div>

  <!-- Timer -->
  <div class="timer-section">
    <div class="timer-label">Time Remaining</div>
    <div class="timer-digits" id="countdown-timer">
      <div class="timer-unit"><div class="timer-card"><span class="num">--</span></div><span class="unit-label">Days</span></div>
      <span class="timer-sep">:</span>
      <div class="timer-unit"><div class="timer-card"><span class="num">--</span></div><span class="unit-label">Hrs</span></div>
      <span class="timer-sep">:</span>
      <div class="timer-unit"><div class="timer-card"><span class="num">--</span></div><span class="unit-label">Min</span></div>
      <span class="timer-sep">:</span>
      <div class="timer-unit"><div class="timer-card"><span class="num">--</span></div><span class="unit-label">Sec</span></div>
    </div>
  </div>

  <!-- Phases -->
  <div id="app"></div>

  <!-- Ad Slot: After Content -->
  <div style="max-width:900px;margin:2rem auto;padding:0 1.25rem;text-align:center;min-height:90px;" aria-label="Advertisement">
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-7287159043409706"
           data-ad-slot="auto"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>

  <!-- Footer -->
  <div style="max-width:900px;margin:2rem auto 0;padding:1.5rem 1.25rem;border-top:1px solid var(--border);text-align:center;">
      <p style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">Built by <a href="https://raghavsihag.me" style="color:var(--accent-2);text-decoration:none;">Raghav Sihag</a></p>
      <div style="display:flex;justify-content:center;gap:8px;align-items:center;">
          <a href="privacy.html" style="font-size:11px;color:var(--text-muted);text-decoration:none;">Privacy Policy</a>
          <span style="font-size:11px;color:var(--text-muted);opacity:0.5;">·</span>
          <a href="terms.html" style="font-size:11px;color:var(--text-muted);text-decoration:none;">Terms</a>
      </div>
  </div>
</div>

<script>
const P = [
  {
    title: "Phase 1 — Foundation",
    icon: "🌸",
    days: "Days 1–30",
    accent: "var(--accent-1)",
    accentBg: "var(--accent-1-bg)",
    accentGlow: "var(--accent-1-glow)",
    wks: [
      { id: "w1", n: 1, days: "Days 1–7", title: "JavaScript basics & variables", topics: ["What is JavaScript & its history", "JavaScript versions & how to run it", "var, let & const", "Variable declarations", "Hoisting", "Variable naming rules", "Variable scopes: block, function, global"] },
      { id: "w2", n: 2, days: "Days 8–14", title: "Data types", topics: ["Primitive types: string, number, boolean", "null, undefined, bigint & Symbol", "typeof operator", "Object basics", "Object prototype", "Built-in objects", "JSON"] },
      { id: "w3", n: 3, days: "Days 15–21", title: "Type casting & equality", topics: ["Type conversion vs coercion", "Implicit type casting", "Explicit type casting", "== vs === & Object.is", "isLooselyEqual & isStrictlyEqual", "SameValueZero & SameValue", "Value comparison operators"] },
      { id: "w4", n: 4, days: "Days 22–30", title: "Expressions & operators", topics: ["Arithmetic & assignment operators", "Comparison operators", "Logical & conditional operators", "Unary operators", "Bitwise operators", "String & BigInt operators", "Comma operators", "Review & mini project"] }
    ]
  },
  {
    title: "Phase 2 — Core Concepts",
    icon: "⭐",
    days: "Days 31–60",
    accent: "var(--accent-2)",
    accentBg: "var(--accent-2-bg)",
    accentGlow: "var(--accent-2-glow)",
    wks: [
      { id: "w5", n: 5, days: "Days 31–37", title: "Control flow", topics: ["if...else & switch statements", "for loop", "while & do...while loops", "for...of & for...in loops", "break & continue", "throw statement", "try/catch/finally", "Error objects"] },
      { id: "w6", n: 6, days: "Days 38–44", title: "Functions", topics: ["Default & rest parameters", "Arrow functions", "IIFEs", "arguments object", "Built-in functions", "Prototypal inheritance"] },
      { id: "w7", n: 7, days: "Days 45–51", title: "Scope, closures & objects", topics: ["Lexical scoping", "Scope & function stack", "Closures", "Recursion", "Object prototype in depth", "Strict mode"] },
      { id: "w8", n: 8, days: "Days 52–60", title: "Data structures & DOM", topics: ["Arrays & typed arrays", "Map & WeakMap", "Set & WeakSet", "Structured data", "Indexed vs keyed collections", "DOM APIs", "Review & project"] }
    ]
  },
  {
    title: "Phase 3 — Advanced",
    icon: "🚀",
    days: "Days 61–90",
    accent: "var(--accent-3)",
    accentBg: "var(--accent-3-bg)",
    accentGlow: "var(--accent-3-glow)",
    wks: [
      { id: "w9", n: 9, days: "Days 61–67", title: "this keyword", topics: ["this in a method", "this in a function", "this alone & in arrow functions", "this in event handlers", "Function borrowing", "call, apply & bind", "Explicit binding"] },
      { id: "w10", n: 10, days: "Days 68–74", title: "Asynchronous JavaScript", topics: ["Event loop", "setTimeout & setInterval", "Callbacks & callback hell", "Promises", "async/await", "XMLHTTPRequest", "Fetch API"] },
      { id: "w11", n: 11, days: "Days 75–81", title: "Modules, classes & APIs", topics: ["CommonJS modules", "ES modules (ESM)", "Classes", "Iterators & generators", "Working with APIs", "Fetch in practice", "API error handling"] },
      { id: "w12", n: 12, days: "Days 82–90", title: "Memory management & DevTools", topics: ["Memory lifecycle", "Garbage collection", "Memory management patterns", "Debugging issues", "Debugging memory leaks", "Debugging performance", "Browser DevTools mastery", "Final project"] }
    ]
  }
];

// State
const savedCK = localStorage.getItem('jsRoadmapCK');
const savedEX = localStorage.getItem('jsRoadmapEX');
const CK = new Set(savedCK ? JSON.parse(savedCK) : []);
const EX = new Set(savedEX ? JSON.parse(savedEX) : ["w1"]);

function saveState() {
  localStorage.setItem('jsRoadmapCK', JSON.stringify([...CK]));
  localStorage.setItem('jsRoadmapEX', JSON.stringify([...EX]));
}

window.ck = id => { CK.has(id) ? CK.delete(id) : CK.add(id); saveState(); render(); };
window.ex = id => { EX.has(id) ? EX.delete(id) : EX.add(id); saveState(); render(); };

function wdone(wid, n) { let c = 0; for (let i = 0; i < n; i++) if (CK.has(wid + "-" + i)) c++; return c; }

function render() {
  const total = P.reduce((s, p) => s + p.wks.reduce((ss, w) => ss + w.topics.length, 0), 0);
  const done = CK.size;
  const pct = total ? Math.round(done / total * 100) : 0;
  const weeksComplete = P.reduce((s, p) => s + p.wks.filter(w => wdone(w.id, w.topics.length) === w.topics.length).length, 0);

  // Hero stats
  document.getElementById('hero-stats').innerHTML = `
    <div class="stat-item"><div class="stat-value">${done}</div><div class="stat-label">Completed</div></div>
    <div class="stat-item"><div class="stat-value">${total - done}</div><div class="stat-label">Remaining</div></div>
    <div class="stat-item"><div class="stat-value">${weeksComplete}/12</div><div class="stat-label">Weeks done</div></div>
  `;

  // Progress bar
  document.getElementById('progress-bar').innerHTML = `
    <div class="progress-header">
      <span class="progress-title">Overall Progress</span>
      <span class="progress-pct">${pct}%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" style="width:${pct}%"></div>
    </div>
  `;

  // Phases
  let h = '';
  P.forEach(ph => {
    const pt = ph.wks.reduce((s, w) => s + w.topics.length, 0);
    const pd = ph.wks.reduce((s, w) => s + wdone(w.id, w.topics.length), 0);
    const pp = pt ? Math.round(pd / pt * 100) : 0;

    h += `<div class="phase">
      <div class="phase-header" style="border-bottom: 1px solid var(--border);">
        <div class="phase-info">
          <h2>${ph.icon} ${ph.title}</h2>
          <div class="phase-meta">${ph.days} · ${pt} topics</div>
        </div>
        <div class="phase-badge">
          <div class="pct" style="color:${ph.accent}">${pp}%</div>
          <div class="frac">${pd}/${pt}</div>
        </div>
      </div>
      <div class="phase-grid">`;

    ph.wks.forEach(w => {
      const d = wdone(w.id, w.topics.length);
      const wp = w.topics.length ? Math.round(d / w.topics.length * 100) : 0;
      const isE = EX.has(w.id);
      const isFull = d === w.topics.length;

      h += `<div class="wk${isE ? ' expanded' : ''}">
        <div class="wh" onclick="ex('${w.id}')">
          <div class="wh-content">
            <div class="week-tag" style="background:${ph.accentBg};color:${ph.accent};">
              W${w.n}${isFull ? ' ✓' : ''}
            </div>
            <div class="week-title">${w.title}</div>
            <div class="week-days">${w.days}</div>
            <div class="week-progress">
              <div class="week-progress-fill" style="width:${wp}%;background:${ph.accent};"></div>
            </div>
            <div class="week-count">${d}/${w.topics.length} topics</div>
          </div>
          <span class="wh-arrow${isE ? ' open' : ''}">▼</span>
        </div>`;

      if (isE) {
        h += `<div class="wb">`;
        w.topics.forEach((t, i) => {
          const tid = `${w.id}-${i}`;
          const chk = CK.has(tid);
          h += `<label for="${tid}" class="topic-row">
            <input type="checkbox" id="${tid}" class="cute-checkbox" style="--chk-color:${ph.accent};" ${chk ? "checked" : ""} onchange="ck('${tid}')">
            <span class="topic-text${chk ? ' done' : ''}">${t}</span>
          </label>`;
        });
        h += `</div>`;
      }
      h += `</div>`;
    });

    h += `</div></div>`;
  });

  document.getElementById('app').innerHTML = h;
}

render();

// ─── COUNTDOWN TIMER ───
function startCountdown() {
  let targetDate = localStorage.getItem('jsRoadmapTarget');
  if (!targetDate) {
    const now = new Date();
    const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    const target = new Date(tomorrow.getTime() + 2160 * 60 * 60 * 1000);
    targetDate = target.getTime();
    localStorage.setItem('jsRoadmapTarget', targetDate);
  } else {
    targetDate = parseInt(targetDate, 10);
  }

  const timerEl = document.getElementById('countdown-timer');

  function update() {
    const now = new Date().getTime();
    const diff = targetDate - now;

    if (diff <= 0) {
      timerEl.innerHTML = `
        <div style="font-size:1.5rem;font-weight:900;background:var(--gradient-main);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">
          🎉 TIME'S UP! 🎉
        </div>`;
      return;
    }

    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hr = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const mn = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const sc = Math.floor((diff % (1000 * 60)) / 1000);
    const pad = n => n.toString().padStart(2, '0');

    timerEl.innerHTML = `
      <div class="timer-unit"><div class="timer-card"><span class="num">${d}</span></div><span class="unit-label">Days</span></div>
      <span class="timer-sep">:</span>
      <div class="timer-unit"><div class="timer-card"><span class="num">${pad(hr)}</span></div><span class="unit-label">Hrs</span></div>
      <span class="timer-sep">:</span>
      <div class="timer-unit"><div class="timer-card"><span class="num">${pad(mn)}</span></div><span class="unit-label">Min</span></div>
      <span class="timer-sep">:</span>
      <div class="timer-unit"><div class="timer-card"><span class="num">${pad(sc)}</span></div><span class="unit-label">Sec</span></div>
    `;
  }

  update();
  setInterval(update, 1000);
}

startCountdown();
</script>

    if (!consent) {
        setTimeout(() => { banner.style.transform = 'translateY(0)'; banner.style.opacity = '1'; banner.style.pointerEvents = 'auto'; }, 1500);
    }
    document.getElementById('cookieAccept').addEventListener('click', () => {
        localStorage.setItem('cookie-consent', 'accepted');
        banner.style.transform = 'translateY(100%)'; banner.style.opacity = '0'; banner.style.pointerEvents = 'none';
    });
    document.getElementById('cookieDecline').addEventListener('click', () => {
        localStorage.setItem('cookie-consent', 'declined');
        banner.style.transform = 'translateY(100%)'; banner.style.opacity = '0'; banner.style.pointerEvents = 'none';
    });
})();
